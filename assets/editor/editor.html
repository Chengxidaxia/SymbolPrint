<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>图案编辑器</title>
<style>
  :root{
    --bg:#f4f6f9; --card:#fff; --border:#dfe3ea; --border-strong:#c6ccd6;
    --text:#1c2026; --sub:#6c7580; --faint:#98a0ac; --accent:#2563d7; --accent-soft:#eaf1fd;
    --danger:#be3030;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;font-family:"Microsoft YaHei UI","Segoe UI",sans-serif;font-size:13px;color:var(--text);background:var(--bg);overflow:hidden;}
  #app{display:flex;flex-direction:column;height:100%;}

  /* 顶部工具栏 */
  #topbar{display:flex;align-items:center;gap:12px;height:46px;padding:0 12px;background:var(--card);border-bottom:1px solid var(--border);flex:0 0 auto;}
  .brand{font-weight:700;font-size:14px;}
  .brand span{font-weight:400;color:var(--sub);font-size:12px;margin-left:8px;}
  .tools{display:flex;align-items:center;gap:4px;margin-left:8px;}
  .sep{width:1px;height:22px;background:var(--border);margin:0 6px;}
  button{font-family:inherit;font-size:12.5px;color:var(--text);background:var(--card);border:1px solid var(--border-strong);
         border-radius:6px;padding:5px 10px;cursor:pointer;}
  button:hover{background:#f6f8fb;}
  button.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600;}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
  button.primary:hover{background:#1c52ba;}
  .tools button{width:36px;height:32px;padding:0;font-size:15px;line-height:1;}
  .tools button.wide{width:auto;padding:0 10px;font-size:12.5px;}
  .spacer{flex:1 1 auto;}
  .right{display:flex;gap:8px;align-items:center;}

  /* 主区 */
  #main{display:flex;flex:1 1 auto;min-height:0;}
  #stage{flex:1 1 auto;display:flex;align-items:center;justify-content:center;overflow:auto;padding:24px;position:relative;}
  #canvasWrap{background:#fff;box-shadow:0 1px 4px rgba(20,30,50,.12);border:1px solid var(--border);}
  svg#canvas{display:block;touch-action:none;}
  #hint{position:absolute;left:16px;bottom:10px;color:var(--faint);font-size:11.5px;}

  /* 右侧面板 */
  #side{width:266px;flex:0 0 auto;background:var(--card);border-left:1px solid var(--border);display:flex;flex-direction:column;min-height:0;}
  .panel{padding:12px 14px;border-bottom:1px solid var(--border);}
  .panel h3{margin:0 0 10px;font-size:12px;color:var(--sub);font-weight:600;letter-spacing:.3px;}
  .row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .row label{width:66px;color:var(--sub);flex:0 0 auto;font-size:12px;}
  .row input[type=number],.row input[type=text]{flex:1 1 auto;min-width:0;height:26px;border:1px solid var(--border-strong);
        border-radius:5px;padding:0 6px;font-family:inherit;font-size:12px;color:var(--text);}
  .row input[type=color]{width:34px;height:26px;padding:0;border:1px solid var(--border-strong);border-radius:5px;background:#fff;cursor:pointer;}
  .row input[type=range]{flex:1 1 auto;}
  .row .val{width:38px;text-align:right;color:var(--sub);font-size:11.5px;}
  #layers .list{max-height:150px;overflow:auto;border:1px solid var(--border);border-radius:6px;}
  .layer{display:flex;align-items:center;gap:8px;padding:6px 8px;cursor:pointer;border-bottom:1px solid #f1f3f7;font-size:12px;}
  .layer:last-child{border-bottom:none;}
  .layer:hover{background:#f7f9fc;}
  .layer.sel{background:var(--accent-soft);color:var(--accent);font-weight:600;}
  .layer .dot{width:8px;height:8px;border-radius:2px;background:var(--border-strong);flex:0 0 auto;}
  .empty{color:var(--faint);font-size:12px;padding:8px 0;}
  .presets{display:flex;gap:6px;flex-wrap:wrap;}
  .presets button{flex:1 1 auto;font-size:12px;}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="brand">图案编辑器<span>SVG · 所见即所得</span></div>
    <div class="tools">
      <button data-tool="select" class="active" title="选择 / 拖动（V）">➤</button>
      <button data-tool="rect" title="矩形（R）">▭</button>
      <button data-tool="ellipse" title="椭圆（O）">◯</button>
      <button data-tool="line" title="直线（L）">╱</button>
      <button data-tool="text" title="文字（T）">T</button>
      <span class="sep"></span>
      <button id="undoBtn" title="撤销（Ctrl+Z）">↶</button>
      <button id="redoBtn" title="重做（Ctrl+Y）">↷</button>
      <button id="delBtn" class="wide" title="删除（Delete）">删除</button>
    </div>
    <div class="spacer"></div>
    <div class="right">
      <span id="zoomInfo" style="color:var(--faint);font-size:11.5px;"></span>
      <button id="cancelBtn">取消</button>
      <button id="okBtn" class="primary">完成</button>
    </div>
  </div>

  <div id="main">
    <div id="stage">
      <div id="canvasWrap"><svg id="canvas" xmlns="http://www.w3.org/2000/svg"></svg></div>
      <div id="hint">拖动移动 · 四角缩放 · 顶部圆点旋转 · 双击文字改内容 · 方向键微调位置</div>
    </div>

    <div id="side">
      <div class="panel" id="props">
        <h3>属性</h3>
        <div id="propsBody"><div class="empty">选中一个图形后可编辑属性。</div></div>
      </div>
      <div class="panel" id="canvasPanel">
        <h3>画布</h3>
        <div class="row"><label>宽度</label><input type="number" id="cw" min="16" max="4000" value="300"></div>
        <div class="row"><label>高度</label><input type="number" id="ch" min="16" max="4000" value="300"></div>
        <div class="row"><label>背景</label><input type="color" id="cbg" value="#ffffff">
          <label style="width:auto;"><input type="checkbox" id="cbgOn" checked> 不透明</label></div>
        <div class="row" style="margin-bottom:0;"><label>预设</label>
          <div class="presets" style="flex:1 1 auto;">
            <button id="presetCircle">圆形章</button>
            <button id="presetSquare">方形章</button>
          </div>
        </div>
      </div>
      <div class="panel" id="layers" style="flex:1 1 auto;overflow:auto;border-bottom:none;">
        <h3>图层</h3>
        <div class="list" id="layerList"></div>
      </div>
    </div>
  </div>
</div>

<script>
"use strict";

/* ==================== 常量与状态 ==================== */
const SVGNS = "http://www.w3.org/2000/svg";
const OVERLAY_ID = "__overlay";

let canvas = document.getElementById("canvas");
let sel = null;              // 当前选中元素
let tool = "select";
let drag = null;             // 进行中的拖动
let history = [];            // 快照栈
let histIndex = -1;
let canvasW = 300, canvasH = 300;
let viewScale = 1;
let seq = 0;

/* ==================== 工具函数 ==================== */
function el(tag, attrs) {
  const n = document.createElementNS(SVGNS, tag);
  if (attrs) for (const k in attrs) n.setAttribute(k, attrs[k]);
  return n;
}
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function num(v, d) { const n = parseFloat(v); return isNaN(n) ? d : n; }

/** 屏幕坐标 → SVG 用户坐标 */
function toSvg(evt) {
  const pt = canvas.createSVGPoint();
  pt.x = evt.clientX; pt.y = evt.clientY;
  return pt.matrixTransform(canvas.getScreenCTM().inverse());
}

function isItem(node) {
  return node && node.getAttribute && node.getAttribute("data-role") === "item";
}
function itemOf(node) {
  while (node && node !== canvas) {
    if (isItem(node)) return node;
    node = node.parentNode;
  }
  return null;
}

function itemName(node) {
  const t = node.tagName.toLowerCase();
  const map = { rect: "矩形", ellipse: "椭圆", circle: "圆", line: "直线", text: "文字", path: "路径", g: "组", image: "图片", polygon: "多边形" };
  return map[t] || t;
}

/* ==================== 画布尺寸 ==================== */
function applyCanvasSize(w, h, keepView) {
  canvasW = clamp(Math.round(w), 16, 4000);
  canvasH = clamp(Math.round(h), 16, 4000);
  canvas.setAttribute("viewBox", `0 0 ${canvasW} ${canvasH}`);
  canvas.setAttribute("width", canvasW);
  canvas.setAttribute("height", canvasH);
  document.getElementById("cw").value = canvasW;
  document.getElementById("ch").value = canvasH;
  fitToStage();
  refreshOverlay();
}

function fitToStage() {
  const stage = document.getElementById("stage");
  const availW = Math.max(80, stage.clientWidth - 48);
  const availH = Math.max(80, stage.clientHeight - 48);
  const s = Math.min(availW / canvasW, availH / canvasH, 1.6);
  viewScale = s;
  canvas.style.width = Math.round(canvasW * s) + "px";
  canvas.style.height = Math.round(canvasH * s) + "px";
  document.getElementById("zoomInfo").textContent = Math.round(s * 100) + "%";
}

/* ==================== 选择与覆盖层 ==================== */
function overlay() {
  let g = document.getElementById(OVERLAY_ID);
  if (!g) {
    g = el("g", { id: OVERLAY_ID });
    g.setAttribute("pointer-events", "none");
    canvas.appendChild(g);
  }
  return g;
}

function clearSelection() {
  sel = null;
  refreshOverlay();
  renderProps();
  renderLayers();
}

function select(node) {
  sel = node;
  refreshOverlay();
  renderProps();
  renderLayers();
}

/** 元素在 SVG 坐标系里的包围盒（含 transform，用屏幕矩形反算） */
function boundsOf(node) {
  const r = node.getBoundingClientRect();
  const m = canvas.getScreenCTM().inverse();
  const p1 = canvas.createSVGPoint(); p1.x = r.left; p1.y = r.top;
  const p2 = canvas.createSVGPoint(); p2.x = r.right; p2.y = r.bottom;
  const a = p1.matrixTransform(m), b = p2.matrixTransform(m);
  return { x: a.x, y: a.y, w: b.x - a.x, h: b.y - a.y };
}

function refreshOverlay() {
  const g = overlay();
  g.innerHTML = "";
  if (!sel || !canvas.contains(sel)) return;

  const b = boundsOf(sel);
  if (b.w <= 0 && b.h <= 0) return;

  const line = el("rect", {
    x: b.x, y: b.y, width: b.w, height: b.h,
    fill: "none", stroke: "#2563d7", "stroke-width": 1 / viewScale,
    "stroke-dasharray": `${4 / viewScale} ${3 / viewScale}`
  });
  g.appendChild(line);

  const r = 4 / viewScale;
  const pts = [
    [b.x, b.y], [b.x + b.w / 2, b.y], [b.x + b.w, b.y],
    [b.x + b.w, b.y + b.h / 2], [b.x + b.w, b.y + b.h],
    [b.x + b.w / 2, b.y + b.h], [b.x, b.y + b.h], [b.x, b.y + b.h / 2]
  ];
  pts.forEach(function (p, i) {
    const c = el("circle", {
      cx: p[0], cy: p[1], r: r, fill: "#fff", stroke: "#2563d7", "stroke-width": 1.2 / viewScale
    });
    c.setAttribute("data-handle", "scale:" + i);
    c.setAttribute("pointer-events", "all");
    c.style.cursor = ["nwse-resize","ns-resize","nesw-resize","ew-resize","nwse-resize","ns-resize","nesw-resize","ew-resize"][i];
    g.appendChild(c);
  });

  // 旋转手柄（顶部）
  const rot = el("circle", {
    cx: b.x + b.w / 2, cy: b.y - 22 / viewScale, r: r * 1.2,
    fill: "#2563d7", stroke: "#fff", "stroke-width": 1 / viewScale
  });
  rot.setAttribute("data-handle", "rotate");
  rot.setAttribute("pointer-events", "all");
  rot.style.cursor = "grab";
  g.appendChild(rot);

  const stem = el("line", {
    x1: b.x + b.w / 2, y1: b.y, x2: b.x + b.w / 2, y2: b.y - 22 / viewScale,
    stroke: "#2563d7", "stroke-width": 1 / viewScale
  });
  g.appendChild(stem);
}

/* ==================== 创建元素 ==================== */
function newItem(tag, attrs) {
  const n = el(tag, attrs || {});
  n.setAttribute("data-role", "item");
  canvas.appendChild(n);
  return n;
}

function createByTool(t, p) {
  if (t === "rect") {
    const n = newItem("rect", {
      x: p.x, y: p.y, width: 1, height: 1,
      fill: "#c0392b", "fill-opacity": 1, stroke: "none"
    });
    return n;
  }
  if (t === "ellipse") {
    const n = newItem("ellipse", {
      cx: p.x, cy: p.y, rx: 1, ry: 1,
      fill: "#c0392b", "fill-opacity": 1, stroke: "none"
    });
    return n;
  }
  if (t === "line") {
    const n = newItem("line", {
      x1: p.x, y1: p.y, x2: p.x, y2: p.y,
      stroke: "#c0392b", "stroke-width": 4, "stroke-linecap": "round"
    });
    return n;
  }
  if (t === "text") {
    const n = newItem("text", {
      x: p.x, y: p.y, "font-family": "Microsoft YaHei", "font-size": Math.max(12, canvasW / 10),
      fill: "#c0392b", "text-anchor": "middle"
    });
    n.textContent = "双击改字";
    return n;
  }
  return null;
}

/** 拖动创建时更新几何 */
function resizeDraft(node, start, cur, keepRatio) {
  const t = node.tagName.toLowerCase();
  let x1 = Math.min(start.x, cur.x), y1 = Math.min(start.y, cur.y);
  let w = Math.abs(cur.x - start.x), h = Math.abs(cur.y - start.y);

  if (keepRatio) {
    const s = Math.max(w, h);
    w = s; h = s;
    if (cur.x < start.x) x1 = start.x - s;
    if (cur.y < start.y) y1 = start.y - s;
  }
  if (t === "rect") {
    node.setAttribute("x", x1); node.setAttribute("y", y1);
    node.setAttribute("width", Math.max(1, w)); node.setAttribute("height", Math.max(1, h));
  } else if (t === "ellipse") {
    node.setAttribute("cx", x1 + w / 2); node.setAttribute("cy", y1 + h / 2);
    node.setAttribute("rx", Math.max(1, w / 2)); node.setAttribute("ry", Math.max(1, h / 2));
  } else if (t === "line") {
    node.setAttribute("x1", start.x); node.setAttribute("y1", start.y);
    node.setAttribute("x2", cur.x); node.setAttribute("y2", cur.y);
  } else if (t === "text") {
    node.setAttribute("x", cur.x); node.setAttribute("y", cur.y);
  }
}

/* ==================== 指针交互 ==================== */
canvas.addEventListener("pointerdown", function (e) {
  if (e.button !== 0) return;
  const handle = e.target.getAttribute && e.target.getAttribute("data-handle");

  if (handle && sel) {
    const p = toSvg(e);
    if (handle === "rotate") {
      const b = boundsOf(sel);
      drag = { mode: "rotate", start: p, cx: b.x + b.w / 2, cy: b.y + b.h / 2, base: currentRotation(sel) };
    } else {
      drag = { mode: "scale", start: p, handle: handle.split(":")[1], base: boundsOf(sel), geom: readGeom(sel) };
    }
    canvas.setPointerCapture(e.pointerId);
    return;
  }

  const node = itemOf(e.target);

  if (tool === "select") {
    if (node) {
      select(node);
      const p = toSvg(e);
      drag = { mode: "move", start: p, geom: readGeom(node) };
      canvas.setPointerCapture(e.pointerId);
    } else {
      clearSelection();
    }
    return;
  }

  // 绘制新元素
  const p = toSvg(e);
  const n = createByTool(tool, p);
  if (!n) return;
  select(n);
  drag = { mode: "draw", start: p, node: n, shift: e.shiftKey };
  canvas.setPointerCapture(e.pointerId);
});

canvas.addEventListener("pointermove", function (e) {
  if (!drag) return;
  const p = toSvg(e);

  if (drag.mode === "draw") {
    resizeDraft(drag.node, drag.start, p, e.shiftKey || (drag.node.tagName.toLowerCase() === "ellipse" && e.ctrlKey));
    refreshOverlay();
    return;
  }

  if (drag.mode === "move") {
    let dx = p.x - drag.start.x, dy = p.y - drag.start.y;
    if (e.shiftKey) { if (Math.abs(dx) > Math.abs(dy)) dy = 0; else dx = 0; }
    applyMove(sel, drag.geom, dx, dy);
    refreshOverlay();
    return;
  }

  if (drag.mode === "scale") {
    const b = drag.base;
    const dx = p.x - drag.start.x, dy = p.y - drag.start.y;
    const idx = parseInt(drag.handle, 10);
    // 依据手柄方向计算新的矩形
    let nx = b.x, ny = b.y, nw = b.w, nh = b.h;
    const west = (idx === 0 || idx === 6 || idx === 7);
    const east = (idx === 2 || idx === 3 || idx === 4);
    const north = (idx === 0 || idx === 1 || idx === 2);
    const south = (idx === 4 || idx === 5 || idx === 6);

    if (east) nw = Math.max(1, b.w + dx);
    if (west) { nw = Math.max(1, b.w - dx); nx = b.x + (b.w - nw); }
    if (south) nh = Math.max(1, b.h + dy);
    if (north) { nh = Math.max(1, b.h - dy); ny = b.y + (b.h - nh); }

    if (e.shiftKey) {
      const r = b.h === 0 ? 1 : (nh / Math.max(1, b.h));
      nw = Math.max(1, b.w * r);
      if (west) nx = b.x + (b.w - nw);
    }
    applyBounds(sel, drag.geom, { x: nx, y: ny, w: nw, h: nh });
    refreshOverlay();
    return;
  }

  if (drag.mode === "rotate") {
    const a0 = Math.atan2(drag.start.y - drag.cy, drag.start.x - drag.cx);
    const a1 = Math.atan2(p.y - drag.cy, p.x - drag.cx);
    let deg = drag.base + (a1 - a0) * 180 / Math.PI;
    if (e.shiftKey) deg = Math.round(deg / 15) * 15;
    setRotation(sel, deg, drag.cx, drag.cy);
    refreshOverlay();
    return;
  }
});

function endDrag(e) {
  if (!drag) return;
  const wasDraw = drag.mode === "draw";
  const node = drag.node;
  drag = null;

  if (wasDraw && node) {
    // 太小的拖拽视为点击：给个默认尺寸
    const t = node.tagName.toLowerCase();
    if (t === "rect" && num(node.getAttribute("width"), 0) < 2) {
      node.setAttribute("width", 40); node.setAttribute("height", 40);
    }
    if (t === "ellipse" && num(node.getAttribute("rx"), 0) < 1) {
      node.setAttribute("rx", 20); node.setAttribute("ry", 20);
    }
    if (t === "line" && Math.abs(num(node.getAttribute("x2"),0) - num(node.getAttribute("x1"),0)) < 2
        && Math.abs(num(node.getAttribute("y2"),0) - num(node.getAttribute("y1"),0)) < 2) {
      canvas.removeChild(node);
      clearSelection();
      pushHistory();
      return;
    }
    setTool("select");
  }

  pushHistory();
  refreshOverlay();
  renderProps();
  renderLayers();
}
canvas.addEventListener("pointerup", endDrag);
canvas.addEventListener("pointercancel", endDrag);

canvas.addEventListener("dblclick", function (e) {
  const node = itemOf(e.target);
  if (!node || node.tagName.toLowerCase() !== "text") return;
  const v = prompt("文字内容：", node.textContent);
  if (v !== null) {
    node.textContent = v;
    refreshOverlay();
    pushHistory();
    renderLayers();
  }
});

/* ==================== 几何读写 ==================== */
function readGeom(node) {
  const t = node.tagName.toLowerCase();
  if (t === "rect") return { x: num(node.getAttribute("x"),0), y: num(node.getAttribute("y"),0),
                             w: num(node.getAttribute("width"),0), h: num(node.getAttribute("height"),0) };
  if (t === "ellipse") { const rx = num(node.getAttribute("rx"),0), ry = num(node.getAttribute("ry"),0);
                         return { cx: num(node.getAttribute("cx"),0), cy: num(node.getAttribute("cy"),0), rx: rx, ry: ry }; }
  if (t === "circle") return { cx: num(node.getAttribute("cx"),0), cy: num(node.getAttribute("cy"),0), r: num(node.getAttribute("r"),0) };
  if (t === "line") return { x1: num(node.getAttribute("x1"),0), y1: num(node.getAttribute("y1"),0),
                             x2: num(node.getAttribute("x2"),0), y2: num(node.getAttribute("y2"),0) };
  if (t === "text") return { x: num(node.getAttribute("x"),0), y: num(node.getAttribute("y"),0),
                             fs: num(node.getAttribute("font-size"),16) };
  return null;
}

function applyMove(node, g, dx, dy) {
  const t = node.tagName.toLowerCase();
  if (!g) { // 不支持的用 transform 平移
    const base = node.getAttribute("data-tx");
    const tx = num(base, 0) + dx, ty = num(node.getAttribute("data-ty"), 0) + dy;
    node.setAttribute("data-tx", tx); node.setAttribute("data-ty", ty);
    node.setAttribute("transform", `translate(${tx} ${ty})`);
    return;
  }
  if (t === "rect") { node.setAttribute("x", g.x + dx); node.setAttribute("y", g.y + dy); }
  else if (t === "ellipse" || t === "circle") { node.setAttribute("cx", g.cx + dx); node.setAttribute("cy", g.cy + dy); }
  else if (t === "line") {
    node.setAttribute("x1", g.x1 + dx); node.setAttribute("y1", g.y1 + dy);
    node.setAttribute("x2", g.x2 + dx); node.setAttribute("y2", g.y2 + dy);
  } else if (t === "text") { node.setAttribute("x", g.x + dx); node.setAttribute("y", g.y + dy); }
}

function applyBounds(node, g, b) {
  const t = node.tagName.toLowerCase();
  if (!g) return;
  if (t === "rect") {
    node.setAttribute("x", b.x); node.setAttribute("y", b.y);
    node.setAttribute("width", b.w); node.setAttribute("height", b.h);
  } else if (t === "ellipse") {
    node.setAttribute("cx", b.x + b.w / 2); node.setAttribute("cy", b.y + b.h / 2);
    node.setAttribute("rx", b.w / 2); node.setAttribute("ry", b.h / 2);
  } else if (t === "line") {
    const sx = g.x1, sy = g.y1, ex = g.x2, ey = g.y2;
    const ow = Math.max(1e-6, Math.abs(ex - sx)), oh = Math.max(1e-6, Math.abs(ey - sy));
    node.setAttribute("x1", b.x + (sx - Math.min(sx, ex)) / ow * b.w);
    node.setAttribute("y1", b.y + (sy - Math.min(sy, ey)) / oh * b.h);
    node.setAttribute("x2", b.x + (ex - Math.min(sx, ex)) / ow * b.w);
    node.setAttribute("y2", b.y + (ey - Math.min(sy, ey)) / oh * b.h);
  } else if (t === "text") {
    node.setAttribute("x", b.x + b.w / 2);
    node.setAttribute("y", b.y + b.h);
    node.setAttribute("font-size", Math.max(4, b.h));
  }
}

function currentRotation(node) {
  const tr = node.getAttribute("transform") || "";
  const m = /rotate\(\s*(-?[\d.]+)/.exec(tr);
  return m ? parseFloat(m[1]) : 0;
}

function setRotation(node, deg, cx, cy) {
  const d = ((deg % 360) + 360) % 360;
  node.setAttribute("data-rot", d);
  node.setAttribute("transform", `rotate(${d.toFixed(2)} ${cx.toFixed(2)} ${cy.toFixed(2)})`);
}

/* ==================== 属性面板 ==================== */
function renderProps() {
  const body = document.getElementById("propsBody");
  if (!sel) {
    body.innerHTML = '<div class="empty">选中一个图形后可编辑属性。</div>';
    return;
  }
  const t = sel.tagName.toLowerCase();
  let html = "";

  const fill = sel.getAttribute("fill") || "#000000";
  const stroke = sel.getAttribute("stroke") || "#000000";
  const sw = sel.getAttribute("stroke-width") || "0";
  const op = parseFloat(sel.getAttribute("fill-opacity") || "1");

  if (t !== "line") {
    html += row("填充", `<input type="color" id="pFill" value="${toHex(fill)}">
      <input type="range" id="pFillA" min="0" max="100" value="${Math.round(op*100)}"><span class="val" id="pFillAV">${Math.round(op*100)}%</span>`);
  }
  html += row("描边", `<input type="color" id="pStroke" value="${toHex(stroke === "none" ? "#000000" : stroke)}">
    <input type="number" id="pStrokeW" min="0" max="200" step="0.5" value="${num(sw,0)}" style="width:56px;flex:0 0 auto;">`);
  html += row("旋转", `<input type="number" id="pRot" min="-360" max="360" step="1" value="${Math.round(currentRotation(sel))}"><span class="val">°</span>`);

  if (t === "rect") {
    html += row("圆角", `<input type="number" id="pRx" min="0" max="500" step="1" value="${num(sel.getAttribute("rx"),0)}">`);
  }
  if (t === "text") {
    html += row("文字", `<input type="text" id="pText" value="${escapeAttr(sel.textContent)}">`);
    html += row("字号", `<input type="number" id="pFontSize" min="4" max="800" value="${num(sel.getAttribute("font-size"),16)}">`);
    html += row("对齐", `<select id="pAnchor" style="flex:1 1 auto;height:26px;border:1px solid var(--border-strong);border-radius:5px;">
      <option value="start">左</option><option value="middle">居中</option><option value="end">右</option></select>`);
    html += row("字重", `<select id="pWeight" style="flex:1 1 auto;height:26px;border:1px solid var(--border-strong);border-radius:5px;">
      <option value="normal">常规</option><option value="bold">粗体</option></select>`);
  }

  html += row("位置", `<input type="number" id="pX" value="${Math.round(boundsOf(sel).x)}" style="width:60px">
    <span class="val" style="width:auto">X</span>
    <input type="number" id="pY" value="${Math.round(boundsOf(sel).y)}" style="width:60px">
    <span class="val" style="width:auto">Y</span>`);

  body.innerHTML = html;
  bindProps(t);

  if (t === "text") {
    document.getElementById("pAnchor").value = sel.getAttribute("text-anchor") || "start";
    document.getElementById("pWeight").value = sel.getAttribute("font-weight") || "normal";
  }
}

function row(label, inner) {
  return `<div class="row"><label>${label}</label>${inner}</div>`;
}
function toHex(c) {
  if (!c || c === "none") return "#000000";
  if (/^#[0-9a-fA-F]{6}$/.test(c)) return c;
  if (/^#[0-9a-fA-F]{3}$/.test(c)) {
    return "#" + c[1]+c[1]+c[2]+c[2]+c[3]+c[3];
  }
  const m = /^rgb\((\d+),\s*(\d+),\s*(\d+)\)$/.exec(c);
  if (m) return "#" + [1,2,3].map(i => (+m[i]).toString(16).padStart(2,"0")).join("");
  return "#000000";
}
function escapeAttr(s) {
  return (s || "").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function bindProps(t) {
  const bind = (id, fn, ev) => {
    const n = document.getElementById(id);
    if (n) n.addEventListener(ev || "input", function () { fn(n); pushHistory(true); refreshOverlay(); renderLayers(); });
  };

  bind("pFill", n => sel.setAttribute("fill", n.value));
  bind("pFillA", n => {
    const v = parseInt(n.value, 10);
    sel.setAttribute("fill-opacity", (v/100).toFixed(2));
    document.getElementById("pFillAV").textContent = v + "%";
  });
  bind("pStroke", n => { sel.setAttribute("stroke", n.value); if (num(sel.getAttribute("stroke-width"),0) === 0) sel.setAttribute("stroke-width", 2); });
  bind("pStrokeW", n => {
    const v = num(n.value, 0);
    if (v <= 0) { sel.setAttribute("stroke", "none"); sel.setAttribute("stroke-width", 0); }
    else { if (!sel.getAttribute("stroke") || sel.getAttribute("stroke") === "none") sel.setAttribute("stroke", "#000000"); sel.setAttribute("stroke-width", v); }
  });
  bind("pRot", n => { const b = boundsOf(sel); setRotation(sel, num(n.value,0), b.x + b.w/2, b.y + b.h/2); });
  bind("pRx", n => sel.setAttribute("rx", Math.max(0, num(n.value,0))));
  bind("pText", n => sel.textContent = n.value);
  bind("pFontSize", n => sel.setAttribute("font-size", Math.max(4, num(n.value,16))));
  bind("pAnchor", n => sel.setAttribute("text-anchor", n.value), "change");
  bind("pWeight", n => sel.setAttribute("font-weight", n.value), "change");
  bind("pX", n => { const g = readGeom(sel); if (!g) return; const b = boundsOf(sel); applyMove(sel, g, num(n.value,0) - b.x, 0); });
  bind("pY", n => { const g = readGeom(sel); if (!g) return; const b = boundsOf(sel); applyMove(sel, g, 0, num(n.value,0) - b.y); });
}

/* ==================== 图层 ==================== */
function renderLayers() {
  const list = document.getElementById("layerList");
  const items = Array.from(canvas.querySelectorAll("[data-role=item]"));
  if (items.length === 0) {
    list.innerHTML = '<div class="empty" style="padding:8px">还没有图形。</div>';
    return;
  }
  list.innerHTML = "";
  items.slice().reverse().forEach(function (n, i) {
    const d = document.createElement("div");
    d.className = "layer" + (n === sel ? " sel" : "");
    const name = itemName(n) + (n.tagName.toLowerCase() === "text" ? "：" + (n.textContent || "").slice(0, 8) : "");
    d.innerHTML = '<span class="dot"></span><span style="flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' +
                  escapeAttr(name) + "</span>";
    d.addEventListener("click", function () { select(n); });
    list.appendChild(d);
  });
}

/* ==================== 历史 ==================== */
function snapshot() {
  const clone = canvas.cloneNode(true);
  const ov = clone.querySelector("#" + OVERLAY_ID);
  if (ov) ov.remove();
  return clone.innerHTML;
}
function pushHistory(coalesce) {
  const s = snapshot();
  if (histIndex >= 0 && history[histIndex] === s) return;
  if (coalesce && histIndex >= 0) {
    history[histIndex] = s;
    return;
  }
  history = history.slice(0, histIndex + 1);
  history.push(s);
  if (history.length > 80) history.shift();
  histIndex = history.length - 1;
}
function restore(s) {
  const props = currentCanvasProps();
  canvas.innerHTML = s;
  restoreCanvasProps(props);
  ensureOverlay();
  sel = null;
  refreshOverlay(); renderLayers(); renderProps();
}
function undo() { if (histIndex > 0) { histIndex--; restore(history[histIndex]); } }
function redo() { if (histIndex < history.length - 1) { histIndex++; restore(history[histIndex]); } }

function currentCanvasProps() {
  return { bg: canvas.style.background || "#ffffff", bgOn: document.getElementById("cbgOn").checked };
}
function restoreCanvasProps(p) {
  applyBackground(p.bg, p.bgOn);
}
function ensureOverlay() { overlay(); }

/* ==================== 工具与快捷键 ==================== */
function setTool(t) {
  tool = t;
  document.querySelectorAll(".tools [data-tool]").forEach(function (b) {
    b.classList.toggle("active", b.getAttribute("data-tool") === t);
  });
  canvas.style.cursor = t === "select" ? "default" : "crosshair";
}
document.querySelectorAll(".tools [data-tool]").forEach(function (b) {
  b.addEventListener("click", function () { setTool(b.getAttribute("data-tool")); });
});

document.getElementById("undoBtn").addEventListener("click", undo);
document.getElementById("redoBtn").addEventListener("click", redo);
document.getElementById("delBtn").addEventListener("click", function () {
  if (!sel) return;
  sel.remove(); clearSelection(); pushHistory();
});

document.addEventListener("keydown", function (e) {
  const tag = (e.target.tagName || "").toLowerCase();
  const typing = tag === "input" || tag === "textarea" || tag === "select";
  if (e.ctrlKey && e.key.toLowerCase() === "z") { e.preventDefault(); undo(); return; }
  if (e.ctrlKey && (e.key.toLowerCase() === "y" || (e.shiftKey && e.key.toLowerCase() === "z"))) { e.preventDefault(); redo(); return; }
  if (typing) return;
  if (e.key === "Delete" || e.key === "Backspace") {
    if (sel) { e.preventDefault(); sel.remove(); clearSelection(); pushHistory(); }
    return;
  }
  const k = e.key.toLowerCase();
  if (k === "v") setTool("select");
  if (k === "r") setTool("rect");
  if (k === "o") setTool("ellipse");
  if (k === "l") setTool("line");
  if (k === "t") setTool("text");
  if (e.key.startsWith("Arrow") && sel) {
    e.preventDefault();
    const step = e.shiftKey ? 10 : 1;
    const g = readGeom(sel);
    if (!g) return;
    const dx = e.key === "ArrowLeft" ? -step : (e.key === "ArrowRight" ? step : 0);
    const dy = e.key === "ArrowUp" ? -step : (e.key === "ArrowDown" ? step : 0);
    applyMove(sel, g, dx, dy);
    refreshOverlay(); pushHistory(true);
  }
});

/* ==================== 画布设置 ==================== */
function applyBackground(color, opaque) {
  document.getElementById("cbg").value = color;
  document.getElementById("cbgOn").checked = opaque;
  canvas.style.background = opaque ? color : "transparent";
  document.getElementById("canvasWrap").style.background =
    opaque ? "#fff" : "repeating-conic-gradient(#e9edf3 0% 25%, #fff 0% 50%) 50% / 12px 12px";
}

document.getElementById("cw").addEventListener("change", function () {
  applyCanvasSize(num(this.value, canvasW), canvasH);
  pushHistory(true);
});
document.getElementById("ch").addEventListener("change", function () {
  applyCanvasSize(canvasW, num(this.value, canvasH));
  pushHistory(true);
});
document.getElementById("cbg").addEventListener("input", function () {
  applyBackground(this.value, document.getElementById("cbgOn").checked);
  pushHistory(true);
});
document.getElementById("cbgOn").addEventListener("change", function () {
  applyBackground(document.getElementById("cbg").value, this.checked);
  pushHistory(true);
});

window.addEventListener("resize", function () { fitToStage(); refreshOverlay(); });

/* ==================== 预设 ==================== */

/* ==================== 导出 ==================== */
function exportSvg() {
  const w = canvasW, h = canvasH;
  const bgOn = document.getElementById("cbgOn").checked;
  const bg = document.getElementById("cbg").value;

  const parts = [];
  parts.push(`<svg xmlns="${SVGNS}" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`);
  if (bgOn) parts.push(`<rect x="0" y="0" width="${w}" height="${h}" fill="${bg}"/>`);
  canvas.querySelectorAll("[data-role=item]").forEach(function (n) {
    const c = n.cloneNode(true);
    c.removeAttribute("data-role");
    c.removeAttribute("data-tx");
    c.removeAttribute("data-ty");
    parts.push(c.outerHTML);
  });
  parts.push("</svg>");
  return parts.join("");
}

document.getElementById("okBtn").addEventListener("click", function () {
  const svg = exportSvg();
  post({ type: "ok", svg: svg });
});
document.getElementById("cancelBtn").addEventListener("click", function () {
  post({ type: "cancel" });
});
function post(obj) {
  if (window.chrome && window.chrome.webview) window.chrome.webview.postMessage(obj);
}

/* ==================== 初始化 ==================== */
const INITIAL_SVG = __INITIAL_SVG__;

function loadInitial(svgText) {
  if (!svgText || !svgText.trim()) {
    applyCanvasSize(300, 300);
    applyBackground("#ffffff", true);
    ensureOverlay();
    renderLayers(); renderProps();
    pushHistory();
    return;
  }
  try {
    const doc = new DOMParser().parseFromString(svgText, "image/svg+xml");
    const root = doc.documentElement;
    const vb = (root.getAttribute("viewBox") || "").split(/[\s,]+/).map(parseFloat);
    let w = num(root.getAttribute("width"), 0), h = num(root.getAttribute("height"), 0);
    if (vb.length === 4 && vb[2] > 0) { w = w || vb[2]; h = h || vb[3]; }
    if (!w || !h) { w = 300; h = 300; }
    applyCanvasSize(w, h);

    canvas.innerHTML = "";
    let bgColor = "#ffffff", bgOn = true;
    Array.from(root.childNodes).forEach(function (n) {
      if (n.nodeType !== 1) return;
      const t = n.tagName.toLowerCase();
      if (t === "rect" && (n.getAttribute("fill") || "").toLowerCase() !== "none"
          && num(n.getAttribute("x"),0) === 0 && num(n.getAttribute("y"),0) === 0
          && num(n.getAttribute("width"),0) >= w && num(n.getAttribute("height"),0) >= h) {
        bgColor = toHex(n.getAttribute("fill"));
        return; // 满画布背景 → 转成画布背景
      }
      const c = document.importNode(n, true);
      c.setAttribute("data-role", "item");
      canvas.appendChild(c);
    });
    applyBackground(bgColor, bgOn);
    ensureOverlay();
    fitToStage();
    renderLayers(); renderProps();
    pushHistory();
  } catch (err) {
    applyCanvasSize(300, 300);
    ensureOverlay();
    post({ type: "error", message: "无法解析初始 SVG：" + err.message });
  }
}

fitToStage();
loadInitial(INITIAL_SVG);
</script>
